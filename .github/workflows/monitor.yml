name: Catalyst Proposal Monitor

on:
  schedule:
    # Chạy mỗi 30 phút (giờ UTC). Đổi cron nếu muốn tần suất khác.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # cho phép bấm nút "Run workflow" chạy tay trên GitHub

permissions:
  contents: write  # cần quyền này để workflow tự push commit

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        run: python fetch_proposals.py

      - name: Commit and push if there are changes
        run: |
          git config user.name "catalyst-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pilot_2026_snapshots
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
          else
            git commit -m "Auto-update proposals $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
