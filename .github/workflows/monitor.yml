name: Catalyst Proposal Monitor

on:
  schedule:
    # Chạy mỗi 30 phút, lệch khỏi mốc :00/:30 (giờ đông đúc nhất) để giảm delay
    # theo khuyến nghị chính thức của GitHub: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: "13,43 * * * *"
  workflow_dispatch: {}  # cho phép bấm nút "Run workflow" chạy tay trên GitHub

permissions:
  contents: write  # cần quyền này để workflow tự push commit

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_proposals.py

      - name: Debug - list snapshot directory
        run: |
          echo "Nội dung thư mục pilot_2026_snapshots:"
          ls -la pilot_2026_snapshots || echo "!!! Thư mục không tồn tại !!!"

      - name: Commit and push if there are changes
        run: |
          git config user.name "catalyst-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p pilot_2026_snapshots
          git add -A pilot_2026_snapshots || true
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
          else
            git commit -m "Auto-update proposals $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi